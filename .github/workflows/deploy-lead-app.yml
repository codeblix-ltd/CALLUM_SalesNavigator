name: Deploy lead app

on:
  push:
    branches:
      - main
    paths:
      - "internal-vite-react-lead-operations/**"
      - ".github/workflows/deploy-lead-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-app-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: internal-vite-react-lead-operations

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal-vite-react-lead-operations/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Deploy build over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.careeraccelerator.net
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: internal-vite-react-lead-operations/dist/
          server-dir: lead.careeraccelerator.net/public_html/
          log-level: standard
          timeout: 60000
