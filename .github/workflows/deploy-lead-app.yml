name: Deploy lead app

on:
  push:
    branches:
      - main
    paths:
      - "internal-vite-react-lead-operations/**"
      - ".github/workflows/deploy-lead-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-app-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: internal-vite-react-lead-operations

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal-vite-react-lead-operations/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build React app
        run: pnpm run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Keep compatibility assets for cached HTML
        shell: bash
        run: |
          # The hosting proxy can retain an older index.html after FTP sync.
          # Keep the currently built bundle available at the last cached names
          # so that stale HTML still boots while its cache expires.
          js_asset="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' ! -name 'index-v7A8r9pT.js' -print -quit)"
          css_asset="$(find dist/assets -maxdepth 1 -type f -name 'index-*.css' ! -name 'index-Bazgb7Vk.css' -print -quit)"
          test -n "$js_asset" && test -n "$css_asset"
          cp "$js_asset" dist/assets/index-v7A8r9pT.js
          cp "$css_asset" dist/assets/index-Bazgb7Vk.css

      - name: Deploy build over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.careeraccelerator.net
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: internal-vite-react-lead-operations/dist/
          server-dir: lead.careeraccelerator.net/public_html/
          log-level: standard
          timeout: 60000
