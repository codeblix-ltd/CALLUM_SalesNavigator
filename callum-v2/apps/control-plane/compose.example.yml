services:
  callum-v2-control-plane:
    build:
      context: ../../..
      dockerfile: callum-v2/apps/control-plane/Dockerfile
    restart: unless-stopped
    env_file: .env.v2
    environment:
      V2_BIND_HOST: 0.0.0.0
      V2_ENVIRONMENT: staging
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
